[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-transcribe-offline"
version = "0.2.0"
description = "Offline Arabic audio transcription and local coding assistant for Termux."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
assistant = ["llama-cpp-python>=0.3,<1"]
vad = ["onnxruntime>=1.17"]
dev = ["pytest>=8"]

[project.scripts]
mega-transcribe = "mega_transcribe.cli:main"
mega-transcribe-web = "mega_transcribe.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mega_transcribe = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
