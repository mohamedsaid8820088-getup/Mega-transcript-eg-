<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Mega Transcribe — CTC</title>
<style>
:root{color-scheme:dark;--bg:#090d0d;--panel:#111919;--line:#293634;--green:#80e32b;--muted:#a3b0ad;--warn:#ffd27a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eff5f2;font:16px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:24px}.brand{color:var(--green);font-weight:800;letter-spacing:.08em}.sub,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}label{display:block;margin:12px 0 6px}input,button{font:inherit;border-radius:9px;padding:11px}input{width:100%;background:#090d0d;border:1px solid var(--line);color:inherit}button{background:var(--green);color:#111;border:0;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}.notice{color:var(--warn);line-height:1.7}#status{white-space:pre-wrap;line-height:1.7}.links a{display:inline-block;color:var(--green);margin:8px}
</style>
</head><body><main>
<div class="brand">◉ MEGA TRANSCRIBE — CTC</div><p class="sub">تفريغ محلي للعربية المصرية باستخدام نموذج ONNX على الجهاز</p>
<section class="card"><h2>حالة النموذج</h2><div id="health" class="muted">جارٍ الفحص…</div></section>
<section class="card"><h2>تفريغ ملف صوتي</h2><p class="notice">يُحفظ الصوت ويُعالَج محليًا. قد يخمّن النموذج كلمات عند الخشخشة أو الضوضاء؛ ��اجع التفريغ، خصوصًا للمقاطع المتداخلة أو الخافتة.</p><form id="form"><label for="audio">اختر ملفًا صوتيًا</label><input id="audio" name="audio" required type="file" accept="audio/*,.amr,.3gp,.mp4,.webm"><fieldset><legend>صيغ الملفات</legend><label><input type="checkbox" name="format" value="txt" checked> TXT</label><label><input type="checkbox" name="format" value="srt" checked> SRT</label><label><input type="checkbox" name="format" value="json" checked> JSON</label></fieldset><button id="run">ابدأ التفريغ</button></form><p id="status" role="status"></p><div id="outputs" class="links"></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){try{const r=await fetch('/api/health');const h=await r.json();$('health').textContent=h.ok?`جاهز — ${h.backend}\nالنموذج: ${h.model}`:`غير جاهز: ${h.error}`}catch(e){$('health').textContent='تعذر الاتصال بالخادم المحلي.'}}boot();
$('form').addEventListener('submit',async e=>{e.preventDefault();const button=$('run');button.disabled=true;$('outputs').textContent='';$('status').textContent='جارٍ رفع الملف إلى المعالجة المحلية…';try{const data=new FormData();data.append('audio',$('audio').files[0]);data.append('formats',[...document.querySelectorAll('input[name="format"]:checked')].map(x=>x.value).join(','));const response=await fetch('/api/transcribe',{method:'POST',body:data});const job=await response.json();if(!response.ok)throw Error(job.error||'تعذر بدء المهمة');let state;do{await new Promise(r=>setTimeout(r,1200));const poll=await fetch('/api/jobs/'+job.id);state=await poll.json();$('status').textContent=state.message||state.status}while(state.status==='queued'||state.status==='processing');if(state.status==='error')throw Error(state.message);$('outputs').innerHTML=(state.outputs||[]).map(x=>`<a href="${esc(x.url)}" download>${esc(x.name)}</a>`).join('')}catch(error){$('status').textContent='فشل التفريغ: '+error.message}finally{button.disabled=false}});
</script></body></html>
